# docker-compose.yml — Atlassian Log Exporter
#
# One-shot job definitions for Jira and Confluence exports.
# Each run persists state in a named volume so subsequent runs resume from where
# they left off.
#
# Run manually:
#   cp config.yaml.example config.yaml   # or point CONFIG_FILE at another path
#   docker compose run --rm jira-log-exporter
#   docker compose run --rm confluence-log-exporter
#
# For recurring runs, schedule the command externally (host cron, systemd timer,
# Kubernetes CronJob, etc.) instead of running a cron daemon in the container.
#
# By default Compose mounts ./config.yaml and starts the exporter with
#   -config /config.yaml
# Override the host-side config path by setting CONFIG_FILE.
#
# Optional environment variables (set in a .env file or export them) are still
# passed through so they can fill in missing config values or override secrets:
#
#   Jira:
#     JIRA_URL              e.g. https://your-org.atlassian.net
#     ATLASSIAN_EMAIL       Atlassian account email
#     ATLASSIAN_TOKEN       Atlassian personal API token
#
#   Confluence:
#     CONFLUENCE_URL        e.g. https://your-org.atlassian.net/wiki
#     ATLASSIAN_EMAIL       Atlassian account email
#     ATLASSIAN_TOKEN       Atlassian personal API token

services:

  jira-log-exporter:
    image: ghcr.io/tomaskovacik/atlassian_log_exporter:latest
    command: ["-config", "/config.yaml", "-source=jira"]
    environment:
      JIRA_URL: ${JIRA_URL}
      ATLASSIAN_EMAIL: ${ATLASSIAN_EMAIL}
      ATLASSIAN_TOKEN: ${ATLASSIAN_TOKEN}
    volumes:
      - ${CONFIG_FILE:-./config.yaml}:/config.yaml:ro
      - jira-state:/state
    working_dir: /state

  confluence-log-exporter:
    image: ghcr.io/tomaskovacik/atlassian_log_exporter:latest
    command: ["-config", "/config.yaml", "-source=confluence"]
    environment:
      CONFLUENCE_URL: ${CONFLUENCE_URL}
      ATLASSIAN_EMAIL: ${ATLASSIAN_EMAIL}
      ATLASSIAN_TOKEN: ${ATLASSIAN_TOKEN}
    volumes:
      - ${CONFIG_FILE:-./config.yaml}:/config.yaml:ro
      - confluence-state:/state
    working_dir: /state

volumes:
  jira-state:
  confluence-state:
